<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You | Snugfit Mouth Guards</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<style>
.menu-toggle { display:none; background:#111; color:#fff; border:none; font-size:1.8em; padding:6px 16px; border-radius:6px; cursor:pointer; position:absolute; top:28px; right:20px; z-index:20; }
.navbar { position:absolute; top:32px; right:60px; z-index:10; display:flex; gap:32px; background:none; width:auto; align-items:center; transition:all .2s; }
.nav-tab { color:#111 !important; white-space:nowrap; font-size:1em; padding:8px 12px; font-family:Poppins, Arial, sans-serif; font-weight:600; text-decoration:none; position:relative; transition:.2s; }
.nav-tab::after { content:""; display:block; height:3px; width:0; background:#111; border-radius:2px; transition:width .3s; margin-top:5px; }
.nav-tab:hover::after { width:100%; }
@media (max-width:900px){ .navbar { gap:16px; right:20px; } .nav-tab { font-size:.9em; padding:6px 8px; } }
@media (max-width:700px){
  .navbar { position:fixed; top:0; right:0; flex-direction:column; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.08); width:70vw; max-width:320px; height:100vh; gap:0; align-items:flex-start; padding:60px 0 0 0; transform:translateX(100%); transition:transform .3s; overflow-y:auto; }
  .navbar.open { transform:translateX(0); }
  .nav-tab { color:#ce4c4c !important; padding:18px 32px; font-size:1.1em; border-bottom:1px solid #eee; width:100%; text-align:left; }
  .menu-toggle { display:block; }
}
.thankyou-hero { position:relative; width:100%; height:140px; background:#fff; margin:0 0 20px 0; }
.thankyou-wrapper{ max-width:800px; margin:40px auto 60px auto; padding:32px 28px; background:#f6f7f9; border:2px solid #1a237e; border-radius:12px; text-align:center; }
.thankyou-wrapper h1{ margin:0 0 14px; font-size:2rem; color:#1a237e; font-family:Poppins, Arial, sans-serif; }
.thankyou-wrapper p{ margin:0 0 10px; line-height:1.45; font-family:Poppins, Arial, sans-serif; }
.back-link{ display:inline-block; margin:8px 6px; background:#1a237e; color:#fff; text-decoration:none; padding:10px 18px; border-radius:6px; font-weight:600; font-family:Poppins, Arial, sans-serif; }
.back-link:hover{ background:#142064; }
.impression-highlight { color:#1a237e; font-weight:700; }
.social-icons { display:flex; flex-direction:row; align-items:center; gap:10px; margin-top:10px; }
.social-icons img { width:50px; height:50px; vertical-align:middle; transition:width 0.2s, height 0.2s; }
.model-image-container { text-align:right; margin-top:-410px; }
.model-image { width:40%; max-width:600px; display:block; margin-left:auto; margin-right:0; margin-bottom:0; }
@media (max-width:900px){
  .thankyou-wrapper{ margin:30px 20px 40px 20px; padding:24px 20px; }
  .thankyou-wrapper h1{ font-size:1.6rem; }
  .model-image-container{ margin-top:-300px; }
  .model-image{ width:45%; max-width:450px; }
  .thankyou-hero img{ left:30px !important; height:48px !important; }
}
@media (max-width:700px){
  .social-icons img { width:28px; height:28px; }
  .thankyou-wrapper{ margin:20px 15px 30px 15px; padding:20px 16px; }
  .thankyou-wrapper h1{ font-size:1.4rem; margin:0 0 12px; }
  .thankyou-wrapper p{ font-size:0.95em; }
  .back-link{ padding:8px 14px; font-size:0.9em; margin:6px 4px; }
  .model-image-container{ display:none; }
  .thankyou-hero{ height:110px; }
  .thankyou-hero img{ left:15px !important; height:40px !important; top:24px !important; }
}
@media (max-width:500px){
  .thankyou-wrapper{ margin:15px 10px 25px 10px; padding:18px 14px; border-width:1px; }
  .thankyou-wrapper h1{ font-size:1.25rem; }
  .thankyou-wrapper p{ font-size:0.9em; }
  .back-link{ display:block; margin:8px auto; max-width:200px; }
  .thankyou-hero{ height:100px; }
  .thankyou-hero img{ left:10px !important; height:36px !important; top:22px !important; }
}
</style>
</head>
<body>
<div class="thankyou-hero">
  <img src="Website Design/Snugfit Secondary Logo TP BG.png" alt="Snugfit Logo"
       style="position:absolute; top:28px; left:60px; height:54px; z-index:11;">
  <button id="navToggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
  <nav id="mainNav" class="navbar" aria-label="Main navigation">
    <a href="Home.html" class="nav-tab">Home</a>
    <a href="Schools&Clubs.html" class="nav-tab">Schools &amp; Clubs</a>
    <a href="personalise.html" class="nav-tab">Personalise</a>
    <a href="Bookings.html" class="nav-tab">Bookings</a>
    <a href="Reviews.html" class="nav-tab">Reviews</a>
    <a href="ContactUs.html" class="nav-tab">Contact</a>
  </nav>
</div>

<main>
  <section class="thankyou-wrapper">
    <h1 id="thankTitle">Thank You</h1>
    <p>Your submission has been received.</p>
    <p id="thankLine2"></p>
    <p id="thankLine3"></p>
    <p>Please contact us to make an appointment for a fitting.</p>
    <a class="back-link" href="ContactUs.html">Contact Us</a>
    <a class="back-link" href="Home.html">Return Home</a>
  </section>
</main>

<div style="text-align: right; margin-top: -410px;" class="model-image-container">
  <img src="Website Design/Male Snugfit Model.png" alt="Male Snugfit Model" class="model-image">
</div>

<script>
const navToggle = document.getElementById('navToggle');
const mainNav = document.getElementById('mainNav');
navToggle.addEventListener('click', () => mainNav.classList.toggle('open'));

(function(){
  const firstName = localStorage.getItem('first_name') || '';
  const impression = localStorage.getItem('impressionNumber') || '';
  const contactEmail = localStorage.getItem('contact_email') || '';
  if(firstName){
    document.getElementById('thankTitle').textContent = `Thank You, ${firstName}`;
  }
  if(impression){
    document.getElementById('thankLine2').innerHTML = `Your impression number is <span class="impression-highlight">${impression}</span>.`;
  }
  if(contactEmail){
    document.getElementById('thankLine3').textContent = `A copy of your order has been emailed to ${contactEmail}.`;
  }
})();
</script>

<footer>
  <p style="font-size:clamp(0.8em,2vw,1.1em); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">&copy; Snugfit Mouth Guards 2026</p>
  <div class="social-icons">
    <a href="mailto:info@snugfitmouthguards.co.za" aria-label="Email">
      <img src="Website Design/Email Icon.png" alt="Email">
    </a>
    <a href="https://facebook.com/snugfitmouthguards/" target="_blank" aria-label="Facebook">
      <img src="Website Design/Facebook Icon.png" alt="Facebook">
    </a>
    <a href="https://instagram.com/snugfitmouthguards/?hl=en" target="_blank" aria-label="Instagram">
      <img src="Website Design/Insta Icon.png" alt="Instagram">
    </a>
    <a href="https://www.youtube.com/@snugfitmouthguards" target="_blank" aria-label="YouTube">
      <img src="Website Design/YouTube Icon.png" alt="YouTube">
    </a>
  </div>
</footer>

</body>
</html>
